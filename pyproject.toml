[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build" 

[project]
name = "text_processing"
version = "0.0.0"
requires-python = ">=3.9"
authors = [
  { name="Ghazaleh Heravi", email="ghazaleh.heravi@gmail.com" },
]
description = "Example package for a CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python"
]
packages = ["greetings"]

[project.scripts]
cli_example = "text_processing.cli:cli_example"